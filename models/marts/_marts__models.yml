version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
      - name: items_count
        description: "Число разных товаров в заказе."
        data_tests: [non_negative]
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
        data_tests: [non_negative]
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
        data_tests: [non_negative]
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: fct_order_items
    description: "Таблица фактов позиций заказа. Зернистость: одна строка — один товар в заказе."
    columns:
      - name: order_item_id
        description: "Первичный ключ позиции заказа (order_id-product_id)."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Внешний ключ на fct_orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Внешний ключ на dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Внешний ключ на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Внешний ключ на dim_dates."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: quantity
        description: "Количество единиц товара."
        data_tests: [non_negative]
      - name: unit_price
        description: "Цена за единицу товара."
        data_tests: [non_negative]
      - name: discount_amount
        description: "Сумма скидки по позиции."
        data_tests: [non_negative]
      - name: gross_amount
        description: "Сумма позиции до скидки."
        data_tests: [non_negative]
      - name: line_amount
        description: "Итоговая сумма позиции после скидки."
        data_tests: [non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: dim_customers
    description: "Измерение клиентов (включая не купивших). Зернистость: одна строка — один клиент."
    columns:
      - name: customer_id
        description: "Первичный ключ клиента."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Дата и время регистрации клиента."
      - name: registration_date
        description: "Дата регистрации клиента."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения клиента."
      - name: first_confirmed_order_id
        description: "ID первой подтверждённой покупки."
      - name: first_confirmed_at
        description: "Дата и время первой подтверждённой покупки."
      - name: confirmed_orders_count
        description: "Количество подтверждённых покупок клиента."
        data_tests: [non_negative]
      - name: confirmed_revenue
        description: "Суммарная выручка по подтверждённым покупкам клиента."
        data_tests: [non_negative]
      - name: is_buyer
        description: "Признак покупателя (есть хотя бы одна подтверждённая покупка)."
        data_tests: [not_null]

  - name: dim_products
    description: "Измерение товаров с трёхуровневой иерархией категорий. Зернистость: одна строка — один товар."
    columns:
      - name: product_id
        description: "Первичный ключ товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Категория товара (нижний уровень)."
      - name: parent_category_name
        description: "Родительская категория (средний уровень)."
      - name: root_category_name
        description: "Корневая категория верхнего уровня (Electronics или Home)."
      - name: category_path
        description: "Полный путь категории от корня."

  - name: dim_dates
    description: "Измерение календаря по датам заказов. Зернистость: одна строка один день."
    columns:
      - name: order_date
        description: "Календарная дата (первичный ключ)."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Квартал (1-4)."
      - name: month
        description: "Месяц (1-12)."
      - name: day_of_week
        description: "День недели ISO (1-7)."
      - name: is_weekend
        description: "Признак выходного дня (суббота или воскресенье)."